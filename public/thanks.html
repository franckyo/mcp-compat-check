<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request Received</title>
<style>
  :root { --bg: #f7f7f5; --text: #1d1d1b; --muted: #5f5f5a; --accent: #1f5fd6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141413; --text: #ededea; --muted: #a8a8a2; --accent: #6b9bff; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Thanks, your request is in.</h1>
  <p>I'll look at your server's results and reply by email within one business day with a fixed-price quote. No work starts, and nothing is charged, until you agree to it.</p>
  <p><a href="/">Check another server</a></p>
</main>
</body>
</html>
